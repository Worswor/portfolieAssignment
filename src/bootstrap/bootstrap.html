<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bootstrap 5 UI Demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="../../index.html">Front Page</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto gap-2">
          <li class="nav-item"><a class="nav-link active" href="../../index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="https://github.com/Worswor/portfolieAssignment">Github</a></li>
          <li class="nav-item"><a class="nav-link" href="#">About</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <!-- Cards -->
    <div class="d-flex align-items-end justify-content-between mb-3">
      <div>
        <h1 class="h3 mb-1">Dashboard</h1>
        <p class="text-muted mb-0">Navbar + cards + form (Bootstrap 5)</p>
      </div>
      <!-- <button class="btn btn-primary">New</button> -->
    </div>

    <div class="row g-2 mb-4">
      <div class="col-12 col-md-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-start">
              <h5 class="card-title mb-1">Name:</h5>
            </div>
            <p class="display-6 mb-0">Lucas Valls-Sjøstrand</p>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-start">
              <h5 class="card-title mb-1">Top-up uddanelse</h5>
              <span class="badge text-bg-primary">2. Semester</span>
            </div>
            <p class="display-6 mb-0">WebUdvikling</p>
            <small class="text-muted">Dev</small>
          </div>
        </div>
      </div>
    </div>

    <!-- Form -->
    <div class="card shadow-sm">
      <div class="card-body">
        <h2 class="h5 mb-3">Contact form</h2>
        <form class="row g-3">
          <div class="col-12 col-md-6">
            <label class="form-label">Hobbies:</label>
            <p>- Tabletop wargaming (Warhammer 40K)</p>
            <p>- Video games</p>
            <p>- Reading</p>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label">idk</label>
            <input type="email" class="form-control" placeholder="Placeholder" />
          </div>
          
          <div class="col-12">
            <label class="form-label">40K hære jeg spiller:</label>
            <figure class="image is-96x96">
              <img src="../assets/NecronIcon.jpg" alt="Necron Icon" />
            </figure>
          </div>
          <div class="col-12 d-flex gap-2">
            <button type="submit" class="btn btn-primary">Send</button>
            <a href="../../index.html" class="btn btn-outline-secondary">Back</a>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
