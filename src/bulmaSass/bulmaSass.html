<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bulma UI Demo</title>
  <link rel="stylesheet" href="./css/main.css">
</head>
<body class="has-background-light">

  <!-- Navbar -->
  <nav class="navbar is-dark" role="navigation" aria-label="main navigation">
    <div class="navbar-brand">
      <a class="navbar-item has-text-weight-semibold" href="../../index.html">Front Page</a>

      <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false" data-target="navMenu">
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
      </a>
    </div>

    <div id="navMenu" class="navbar-menu">
      <div class="navbar-end">
        <a class="navbar-item is-active" href="../../index.html">Home</a>
        <a class="navbar-item" href="https://github.com/Worswor/portfolieAssignment">Github</a>
        <a class="navbar-item" href="#">About</a>
      </div>
    </div>
  </nav>

  <main class="section">
    <div class="container">
      <!-- Cards -->
      <div class="is-flex is-justify-content-space-between is-align-items-flex-end mb-4">
        <div>
          <h1 class="title is-4 mb-1">Dashboard</h1>
          <p class="subtitle is-6 has-text-grey">Navbar + cards + form (Bulma)</p>
        </div>
        <!-- <button class="button is-primary">New</button> -->
      </div>

      <div class="columns is-multiline">
        <div class="column is-12-mobile is-half-desktop"> <!-- is-half-desktop for correct layout -->
          <div class="card">
            <div class="card-content">
              <div class="is-flex is-justify-content-space-between">
                <p class="title is-6 mb-1">Name:</p>
              </div>
              <p class="title is-3 mb-1">Lucas Valls-Sjøstrand</p>
            </div>
          </div>
        </div>

        <div class="column is-12-mobile is-half-desktop">
          <div class="card">
            <div class="card-content">
              <div class="is-flex is-justify-content-space-between">
                <p class="title is-6 mb-1">Top-up uddanelse</p>
                <span class="tag is-info is-light">2. semester</span>
              </div>
              <p class="title is-3 mb-1">WebUdvikling</p>
              <p class="has-text-grey is-size-7">DEV</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Form -->
      <div class="card mt-5">
        <div class="card-content">
          <h2 class="title is-5 mb-3">Contact form</h2>
          <form>
            <div class="columns is-multiline">
              <div class="column is-12-mobile is-6-tablet">
                <div class="field">
                  <label class="label">Hobbies</label>
                  <div class="control">
                    <p>- Tabletop wargaming (Warhammer 40K)</p>
                    <p>- Video games</p>
                    <p>- Reading</p>
                  </div>
                </div>
              </div>
              <div class="column is-12-mobile is-6-tablet">
                <div class="field">
                  <label class="label">Input Space</label>
                  <div class="control">
                    <input class="input" type="email" placeholder="Placeholder">
                  </div>
                </div>
              </div>

              <div class="column is-12">
                <div class="field">
                  <label class="label">40K hære jeg spiller:</label>
                  <img src="../assets/NecronIcon.jpg" alt="Necron Icon" class="mb-2" style="width: 60px; height: 60px;">
                  <img src="../assets/AlphaLegionLogo.jpg" alt="Necron Icon" class="mb-2" style="width: 60px; height: 60px;">
                  <img src="../assets/TauLogo.webp" alt="Necron Icon" class="mb-2" style="width: 60px; height: 60px;">
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>

      <!-- Pixel Art Stuff -->
      <div class="card mt-5">
        <div class="card-content">
          <h2 class="title is-5 mb-3">Pixel Art</h2>
          <form>
            <div class="columns is-multiline">
              <div class="column is-12">
                <div class="field">
                  <label class="label">Sprites jeg lavet under Game Development i min Datamatiker uddanelse:</label>
                  <img src="../assets/RitR Title.png" alt="RitR Title" class="mb-2" style="width: 300px; height: 100px;">
                  <div>
                    <img src="../assets/Player_v2.png" alt="RitR Player" class="mb-2" style="width: 500px; height: 500px;">
                    <img src="../assets/Buttons_v1.png" alt="RitR Buttons" class="mb-2" style="width: 500px; height: 500px;">
                  </div>
                  <div>
                    <img src="../assets/MiniTank_Mortor_v1.png" alt="RitR Mortar Tank" class="mb-2" style="width: 400px; height: 400px;">
                    <img src="../assets/Computer Chips_v1.png" alt="RitR Currency" class="mb-2" style="width: 400px; height: 400px;">
                  </div>
                </div>
              </div>

              <div class="column is-12">
                <div class="buttons">
                  <button class="button is-primary" type="submit">Send</button>
                  <a class="button is-light" href="../../index.html">Back</a>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script>
    // Bulma navbar burger toggle (Bulma has no JS by default)
    document.addEventListener('DOMContentLoaded', () => {
      const burger = document.querySelector('.navbar-burger');
      const menu = document.getElementById(burger?.dataset.target);
      if (!burger || !menu) return;

      burger.addEventListener('click', () => {
        burger.classList.toggle('is-active');
        menu.classList.toggle('is-active');
      });
    });
  </script>
</body>
</html>
