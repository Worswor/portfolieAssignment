<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tailwind UI Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100">

  <!-- Header/Navigation -->
  <nav class="bg-[#4A1F1F] text-white">
    <div class="mx-auto max-w-6xl px-4">
      <div class="flex h-14 items-center justify-between">
        <a class="font-semibold tracking-tight" href="../../index.html">Front Page</a>

        <button id="menuBtn" class="md:hidden rounded px-3 py-2 text-sm ring-1 ring-white/20">
          Menu
        </button>

        <div id="menu" class="hidden md:flex items-center gap-6">
          <a class="text-white/90 hover:text-white" href="../../index.html">Home</a>
          <a class="text-white/90 hover:text-white" href="https://github.com/Worswor/portfolieAssignment">Github</a>
          <a class="text-white/90 hover:text-white" href="#">About</a>
        </div>
      </div>

      <div id="mobileMenu" class="hidden pb-4 md:hidden">
        <div class="flex flex-col gap-2">
          <a class="rounded px-2 py-1 hover:bg-white/10" href="../../index.html">Home</a>
          <a class="rounded px-2 py-1 hover:bg-white/10" href="#">Github</a>
          <a class="rounded px-2 py-1 hover:bg-white/10" href="#">About</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="mx-auto max-w-6xl px-4 py-10">
    <!-- Cards -->
    <div class="mb-4 flex items-end justify-between gap-4">
      <div>
        <h1 class="text-xl font-semibold">Dashboard</h1>
        <p class="text-sm text-slate-600">Navbar + cards + form (Tailwind)</p>
      </div>
      <!-- <button class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-medium text-white hover:bg-slate-800">
        New
      </button> -->
    </div>

    <div class="grid gap-3 md:grid-cols-2 mb-6"> <!-- grid-cols-2 for correct layout -->
      <div class="rounded-xl bg-white p-5 shadow-sm ring-1 ring-black/5">
        <div class="flex items-start justify-between">
          <p class="text-sm font-medium text-slate-600">Name:</p>
        </div>
        <p class="mt-2 text-3xl font-semibold">Lucas Valls-Sjøstrand</p>
      </div>

      <div class="rounded-xl bg-white p-5 shadow-sm ring-1 ring-black/5">
        <div class="flex items-start justify-between">
          <p class="text-sm font-medium text-slate-600">Top-up uddannelse</p>
          <span class="rounded-full bg-sky-50 px-2 py-1 text-xs font-medium text-sky-700">2. semester</span>
        </div>
        <p class="mt-2 text-3xl font-semibold">Webudvikling</p>
        <p class="mt-1 text-xs text-slate-500">DEV</p>
      </div>
    </div>

    <!-- Info Form -->
    <div class="mb-6 rounded-xl bg-white p-6 shadow-sm ring-1 ring-black/5">
      <h2 class="text-base font-semibold">Info form</h2>
      <form class="mt-4 grid gap-4">
        <div class="grid gap-4 md:grid-cols-2">
          <div>
            <label class="block text-sm font-medium text-slate-700">Hobbies:</label>
            <p>- Tabletop wargaming (Warhammer 40K)</p>
            <p>- Video games</p>
            <p>- Reading</p>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700">Input space</label>
            <input type="email"
                   class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900"
                   placeholder="Placeholder" />
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700">40K hære jeg spiller:</label>
          <div class="flex gap-4 mt-2">
            <img src="../assets/NecronIcon.jpg" alt="Necron Icon" class="h-20 w-20 object-scale-down" style="width: 60; height: 60;" />
            <img src="../assets/AlphaLegionLogo.jpg" alt="Necron Icon" class="h-20 w-20 object-scale-down" style="width: 60; height: 60;" />
            <img src="../assets/TauLogo.webp" alt="Necron Icon" class="h-20 w-20 object-scale-down" style="width: 60; height: 60;" />
          </div>
        </div>
      </form>
    </div>

    <!-- Pixel art stuff -->
    <div class="rounded-xl bg-white p-6 shadow-sm ring-1 ring-black/5">
      <h2 class="text-base font-semibold">Pixel Art</h2>
      <form class="mt-4 grid gap-4">
        <div class="grid gap-4 md:grid-cols-2"> <!-- Weirdly only with "grid-cols-2" can I control the size? -->
          <div>
            <label class="block text-sm font-medium text-slate-700">Sprites jeg lavet under Game Development i min Datamatiker uddanelse:</label>
            <img src="../assets/RitR Title.png" alt="RitR Title" class="h-200 w-200 object-scale-down" style="width: 200; height: 200;" />
            <div class="flex gap-4 mt-2">
              <img src="../assets/Player_v2.png" alt="RitR Player" class="h-200 w-200 object-scale-down" style="width: 200; height: 200;" />
              <img src="../assets/Buttons_v1.png" alt="RitR Buttons" class="h-200 w-200 object-scale-down" style="width: 200; height: 200;" />
            </div>
            <div class="flex gap-4 mt-2">
              <img src="../assets/MiniTank_Mortor_v1.png" alt="RitR Mortar Tank" class="h-200 w-200 object-scale-down" style="width: 200; height: 200;" />
              <img src="../assets/Computer Chips_v1.png" alt="RitR currency" class="h-200 w-200 object-scale-down" style="width: 200; height: 200;" />
            </div>
          </div>
        </div>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-[#4A1F1F] text-white text-center py-5">
    <p>Lucas Valls-Sjøstrand 2026</p>
  </footer>

  <script>
    // Simple mobile menu toggle (Tailwind doesn't include JS)
    const btn = document.getElementById('menuBtn');
    const mobileMenu = document.getElementById('mobileMenu');

    if (btn && mobileMenu) {
      btn.addEventListener('click', () => {
        mobileMenu.classList.toggle('hidden');
      });
    }
  </script>
</body>
</html>
